services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: elearning
      POSTGRES_PASSWORD: elearning
      POSTGRES_DB: elearning
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elearning"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Penyimpanan S3-kompatibel lokal (cache audio TTS). MENGGANTIKAN MinIO: image `minio/minio` tidak bisa ditarik dari
  # Docker Hub ("pull access denied", diuji 2026-09-29 saat image Docker Hub lain bisa), sehingga `docker compose up` gagal. SeaweedFS
  # berbicara API S3 yang sama. Bucket dibaca publik tanpa kunci (hanya GET/HEAD objek; tidak bisa list/tulis/hapus)
  # supaya URL audio langsung bisa dibuka browser -- kunci dev = S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY di
  # apps/api/.env.example. Untuk produksi: deploy/docker-compose.yml.
  storage:
    image: chrislusf/seaweedfs:4.48
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<'JSON'
        {"identities":[
          {"name":"app","credentials":[{"accessKey":"elearning","secretKey":"elearning123"}],"actions":["Admin","Read","List","Tagging","Write"]},
          {"name":"anonymous","actions":["Read:audio-assets"]}
        ]}
        JSON
        exec weed server -dir=/data -ip=storage -master.volumeSizeLimitMB=256 -volume.max=8 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    ports:
      - "9000:8333" # S3 API
    volumes:
      - storage_data:/data
    healthcheck:
      # Sehat = gerbang S3 hidup DAN volume server sudah terdaftar di master. `/healthz` saja tidak cukup: sesaat
      # sesudah restart ia sudah 200 padahal volume belum terdaftar, sehingga GET objek sempat 500 ("volume not found").
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8333/healthz && wget -q -O- http://localhost:9333/dir/status | grep -q '\"DataNodes\":\\[{'"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Membuat bucket `audio-assets` sekali (aman diulang).
  storage-init:
    image: chrislusf/seaweedfs:4.48
    restart: "no"
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if echo "s3.bucket.list" | weed shell -master=storage:9333 2>/dev/null | grep -q "audio-assets"; then
          echo "bucket audio-assets sudah ada"
        else
          echo "s3.bucket.create -name audio-assets" | weed shell -master=storage:9333
        fi

volumes:
  postgres_data:
  redis_data:
  storage_data:
