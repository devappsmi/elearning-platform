# Stack PRODUKSI (satu server). Panduan lengkap: docs/DEPLOY.md.
#
#   cd deploy && sh gen-env.sh && $EDITOR .env
#   docker compose up -d --build
#   docker compose run --rm tools pnpm run db:seed
#   docker compose run --rm -e ADMIN_EMAIL -e ADMIN_PASSWORD tools pnpm run admin:create
#
# Yang menerima lalu lintas dari luar HANYA `edge` (Caddy: port 80/443, dan 8080 untuk mode uji lewat IP).
# Postgres, Redis, penyimpanan, dan API tidak dipublikasikan ke host.
# Butuh Docker Compose v2.20+.

name: elearning

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-environment: &api-environment
  NODE_ENV: production
  PORT: "3001"
  # Zona waktu "hari" untuk kuota tutor, streak, dan leaderboard mingguan (lihat docs/PLAN.md).
  TZ: ${TZ:-Asia/Jakarta}
  DATABASE_URL: postgresql://elearning:${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di deploy/.env}@postgres:5432/elearning
  REDIS_URL: redis://redis:6379
  JWT_STUDENT_SECRET: ${JWT_STUDENT_SECRET:?isi JWT_STUDENT_SECRET di deploy/.env}
  JWT_ADMIN_SECRET: ${JWT_ADMIN_SECRET:?isi JWT_ADMIN_SECRET di deploy/.env}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-1h}
  JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-14d}
  MAIL_FROM: ${MAIL_FROM:-noreply@example.com}
  MAIL_PROVIDER_API_KEY: ${MAIL_PROVIDER_API_KEY:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:8333}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-audio-assets}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?isi S3_ACCESS_KEY_ID di deploy/.env}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?isi S3_SECRET_ACCESS_KEY di deploy/.env}
  # Alamat yang dibuka BROWSER untuk audio. Bawaan: lewat situs murid (/media diteruskan Caddy ke penyimpanan).
  S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-${PUBLIC_STUDENT_URL}/media}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-5.6-terra}
  OPENAI_STT_MODEL: ${OPENAI_STT_MODEL:-gpt-transcribe}
  OPENAI_TTS_MODEL: ${OPENAI_TTS_MODEL:-gpt-4o-mini-tts}
  OPENAI_TTS_VOICE_DEFAULT: ${OPENAI_TTS_VOICE_DEFAULT:-nova}
  TUTOR_DAILY_QUOTA: ${TUTOR_DAILY_QUOTA:-20}
  AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
  AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-}
  # Alamat publik kedua aplikasi: dipakai untuk membentuk tautan undangan/reset password dan untuk CORS.
  CORS_ORIGIN_STUDENT: ${PUBLIC_STUDENT_URL:?isi PUBLIC_STUDENT_URL di deploy/.env}
  CORS_ORIGIN_ADMIN: ${PUBLIC_ADMIN_URL:?isi PUBLIC_ADMIN_URL di deploy/.env}
  # Tepat satu proxy tepercaya (Caddy) di depan API -- supaya pembatas per-IP membaca IP klien sungguhan.
  TRUST_PROXY: "1"

# Alat sekali-jalan (migrasi, seed, admin) -- image dari target `tools` di apps/api/Dockerfile.
x-tools: &tools
  build:
    context: ..
    dockerfile: apps/api/Dockerfile
    target: tools
  image: elearning-tools:local
  environment: *api-environment
  logging: *logging

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: elearning
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di deploy/.env}
      POSTGRES_DB: elearning
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elearning -d elearning"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  # Redis menyimpan pembatas laju, kunci login, kuota tutor, dan leaderboard mingguan -> persisten (AOF).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  # Penyimpanan S3-kompatibel BAWAAN untuk audio (SeaweedFS). Bucket dibaca publik tanpa kunci (hanya GET/HEAD
  # objek; tidak bisa list/tulis/hapus) -- lewat /media di Caddy. Untuk S3 luar (AWS S3, R2, dll.) kosongkan
  # COMPOSE_PROFILES di .env dan isi S3_* -- lihat docs/DEPLOY.md.
  storage:
    image: chrislusf/seaweedfs:4.48
    profiles: ["builtin-storage"]
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?isi S3_ACCESS_KEY_ID di deploy/.env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?isi S3_SECRET_ACCESS_KEY di deploy/.env}
      S3_BUCKET: ${S3_BUCKET:-audio-assets}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<JSON
        {"identities":[
          {"name":"app","credentials":[{"accessKey":"$${S3_ACCESS_KEY_ID}","secretKey":"$${S3_SECRET_ACCESS_KEY}"}],"actions":["Admin","Read","List","Tagging","Write"]},
          {"name":"anonymous","actions":["Read:$${S3_BUCKET}"]}
        ]}
        JSON
        exec weed server -dir=/data -ip=storage -master.volumeSizeLimitMB=1024 -volume.max=30 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    volumes:
      - storage_data:/data
    healthcheck:
      # Sehat = gerbang S3 hidup DAN volume server sudah terdaftar di master. `/healthz` saja tidak cukup: sesaat
      # sesudah restart ia sudah 200 padahal volume belum terdaftar, sehingga GET objek sempat 500 ("volume not found").
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8333/healthz && wget -q -O- http://localhost:9333/dir/status | grep -q '\"DataNodes\":\\[{'"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging: *logging

  # Membuat bucket sekali (aman diulang: bucket yang sudah ada dibiarkan).
  storage-init:
    image: chrislusf/seaweedfs:4.48
    profiles: ["builtin-storage"]
    restart: "no"
    depends_on:
      storage:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:-audio-assets}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if echo "s3.bucket.list" | weed shell -master=storage:9333 2>/dev/null | grep -q "$${S3_BUCKET}"; then
          echo "bucket $${S3_BUCKET} sudah ada"
        else
          echo "s3.bucket.create -name $${S3_BUCKET}" | weed shell -master=storage:9333
        fi
    logging: *logging

  # Migrasi skema database; `api` baru start setelah ini SELESAI dengan sukses.
  migrate:
    <<: *tools
    command: ["pnpm", "run", "db:deploy"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: elearning-api:local
    restart: unless-stopped
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "3001"
    # Pemeriksaan lebih rapat daripada bawaan image (30 dtk) supaya `up` tidak menunggu lama sebelum `edge` mulai.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    logging: *logging

  # Caddy + berkas statis kedua aplikasi web. Satu-satunya layanan yang membuka port ke luar.
  edge:
    build:
      context: ..
      dockerfile: deploy/edge.Dockerfile
    image: elearning-edge:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      STUDENT_ADDRESS: ${STUDENT_ADDRESS:?isi STUDENT_ADDRESS di deploy/.env}
      ADMIN_ADDRESS: ${ADMIN_ADDRESS:?isi ADMIN_ADDRESS di deploy/.env}
      S3_BUCKET: ${S3_BUCKET:-audio-assets}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "8080:8080"
    volumes:
      - caddy_data:/data # sertifikat HTTPS -- jangan dihapus (batas penerbitan Let's Encrypt)
      - caddy_config:/config
    logging: *logging

  # Perintah manual: seed konten, buat admin, dsb. `docker compose run --rm tools pnpm run <skrip>`.
  tools:
    <<: *tools
    profiles: ["tools"]
    command: ["pnpm", "run", "db:seed"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  storage_data:
  caddy_data:
  caddy_config:
