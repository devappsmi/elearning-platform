name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: elearning
          POSTGRES_PASSWORD: elearning
          POSTGRES_DB: elearning
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U elearning"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      # Versi pnpm diambil dari `packageManager` di package.json (satu sumber
      # kebenaran). JANGAN menambah `with: version:` di sini -- pnpm/action-setup
      # menolak konfigurasi ganda ("Multiple versions of pnpm specified").
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Klien Prisma harus di-generate SEBELUM typecheck/test: tidak ada langkah
      # install yang melakukannya (postinstall @prisma/client tidak menemukan
      # schema di apps/api/prisma dari root monorepo), dan tanpa itu typecheck
      # apps/api gagal ("has no exported member 'PrismaClient'"). Tidak butuh
      # DATABASE_URL -- generate hanya membaca schema.
      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate

      - run: pnpm turbo run lint typecheck test

      - name: Migration drift check
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://elearning:elearning@localhost:5432/elearning
        run: pnpm prisma migrate deploy
